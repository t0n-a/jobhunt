<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E · Fit map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Hallmark · macrostructure: Chart-led workbench · tone: atmospheric · theme: Midnight
 * the inbox as a map: x = how fresh, y = fit, colour = stage; list and map stay linked */
:root {
  --paper: oklch(15% 0.03 265); --panel: oklch(19% 0.035 265); --ink: oklch(93% 0.01 265); --ink-soft: oklch(70% 0.03 265);
  --line: oklch(30% 0.04 265); --glow: oklch(45% 0.12 265 / .35); --focus: oklch(85% 0.14 85);
  --found: oklch(72% 0.03 265); --ranked: oklch(75% 0.13 230); --drafted: oklch(74% 0.15 305);
  --waiting: oklch(85% 0.15 85); --sent: oklch(78% 0.15 160); --blocked: oklch(68% 0.2 25);
  --flag: oklch(70% 0.2 25);
  --display: "Instrument Serif", Georgia, serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", monospace;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --paper: oklch(97% 0.008 265); --panel: oklch(100% 0 0); --ink: oklch(22% 0.03 265); --ink-soft: oklch(45% 0.03 265);
  --line: oklch(88% 0.015 265); --glow: oklch(80% 0.08 265 / .35); --focus: oklch(50% 0.2 265);
  --found: oklch(55% 0.03 265); --ranked: oklch(52% 0.14 235); --drafted: oklch(50% 0.17 305);
  --waiting: oklch(62% 0.15 70); --sent: oklch(52% 0.14 160); --blocked: oklch(52% 0.2 25); --flag: oklch(52% 0.2 25);
}}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; color: var(--ink); font: 15px/1.5 var(--body);
  background: radial-gradient(60rem 40rem at 70% -10%, var(--glow), transparent 70%), var(--paper); min-height: 100dvh; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 28px; padding: 20px 24px 8px; }
header .t { font: 36px/1 var(--display); }
header nav a { color: var(--ink-soft); text-decoration: none; margin-right: 16px; font-weight: 500; }
header nav a[aria-current] { color: var(--ink); border-bottom: 1px solid var(--focus); }
.wrap { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; padding: 12px 24px 40px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.map { padding: 16px; }
.map h2, .list h2 { font: 26px/1.1 var(--display); margin: 0 0 4px; font-weight: 400; }
.map p.sub { margin: 0 0 8px; color: var(--ink-soft); font-size: 13px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
svg .grid line { stroke: var(--line); }
svg text { fill: var(--ink-soft); font: 500 11px var(--mono); }
svg .band { fill: var(--glow); }
svg circle.dot { stroke: var(--paper); stroke-width: 2; cursor: pointer; transition: r .15s ease-out; }
svg circle.halo { fill: none; stroke: var(--focus); stroke-width: 2; opacity: 0; }
svg g.pt.on circle.halo { opacity: 1; }
svg g.pt.flagged .ring { fill: none; stroke: var(--flag); stroke-dasharray: 3 3; stroke-width: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--ink-soft); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.list { padding: 16px 0; overflow: hidden; }
.list h2 { padding: 0 16px; }
.list ol { list-style: none; margin: 8px 0 0; padding: 0; }
.list li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.list li.on { background: color-mix(in oklch, var(--focus) 12%, transparent); }
.list .n { font: 30px/1 var(--display); }
.list .ttl { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list .co { color: var(--ink-soft); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .05em; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.detail { grid-column: 2 / -1; display: none; padding-top: 6px; }
li.on .detail { display: block; }
.flag { border: 1px dashed var(--flag); color: var(--flag); padding: 6px 10px; border-radius: 8px; margin: 6px 0; font-size: 13px; }
.flag span { color: var(--ink); background: color-mix(in oklch, var(--flag) 22%, transparent); padding: 0 3px; }
.go { font: 600 13px var(--body); background: var(--ink); color: var(--paper); border: 0; border-radius: 99px; padding: 7px 14px; cursor: pointer; margin-top: 6px; }
.go:hover { background: var(--focus); }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); padding: 12px 16px 40px; } header { padding: 16px; } }
@media (prefers-reduced-motion: reduce) { svg circle.dot { transition: none; } }
</style>
</head>
<body>
<header><span class="t">jobhunt</span>
  <nav><a href="#">Home</a><a href="#">Today</a><a href="#" aria-current="page">Jobs</a><a href="#">Gaps</a><a href="#">Applications</a><a href="#">Evidence</a><a href="#">Counselor</a></nav></header>
<div class="wrap">
  <section class="panel map"><h2>Where your matches sit</h2><p class="sub">Up is better fit, right is fresher. Dashed ring: text needs checking.</p>
    <svg id="chart" viewBox="0 0 520 340" role="img" aria-label="Jobs plotted by fit and freshness"></svg>
    <div class="legend" id="legend"></div></section>
  <section class="panel list"><h2>Ranked</h2><ol id="list"></ol></section>
</div>
<script src="data.js"></script>
<script>
const C = s => `var(--${s})`;
const hours = a => parseFloat(a) * ({ m: 1 / 60, h: 1, d: 24 }[a.slice(-1)]);
const X = j => 500 - Math.min(hours(j.age), 168) / 168 * 450, Y = j => 310 - (j.fit - 40) / 60 * 290;
let on = JOBS[0].id;
const grid = [40, 60, 80, 100].map(f => { const y = 310 - (f - 40) / 60 * 290; return `<line x1="40" x2="510" y1="${y}" y2="${y}"/><text x="4" y="${y + 4}">${f}</text>`; }).join("");
function render() {
  chart.innerHTML = `<rect class="band" x="40" y="${Y({ fit: 100 })}" width="470" height="${Y({ fit: 80 }) - Y({ fit: 100 })}" rx="6"/>
    <g class="grid">${grid}</g><text x="40" y="334">7 days ago</text><text x="470" y="334">now</text>` +
    JOBS.map(j => `<g class="pt${j.id === on ? " on" : ""}${j.flag ? " flagged" : ""}" data-id="${j.id}" tabindex="0" aria-label="${j.title}, ${j.company}, fit ${j.fit}">
      <circle class="halo" cx="${X(j)}" cy="${Y(j)}" r="14"/>${j.flag ? `<circle class="ring" cx="${X(j)}" cy="${Y(j)}" r="11"/>` : ""}
      <circle class="dot" cx="${X(j)}" cy="${Y(j)}" r="${j.id === on ? 8 : 6}" fill="${C(j.status)}"/></g>`).join("");
  legend.innerHTML = STAGES.map(s => `<span><i style="background:${C(s)}"></i>${STAGE_LABEL[s]}</span>`).join("");
  list.innerHTML = JOBS.map(j => `<li class="${j.id === on ? "on" : ""}" data-id="${j.id}">
    <span class="n">${j.fit}</span><div><div class="ttl">${j.title}</div><div class="co">${j.company} · ${j.where}</div></div>
    <span class="st" style="--c:${C(j.status)}">${STAGE_LABEL[j.status]}</span>
    <div class="detail">${j.rationale}${j.flag ? `<div class="flag">Unverified: <span>${j.flag.text}</span>, ${j.flag.why}</div>` : ""}
      <div><button class="go">${j.next}</button></div></div></li>`).join("");
}
const pick = e => { const t = e.target.closest("[data-id]"); if (t && +t.dataset.id !== on) { on = +t.dataset.id; render(); } };
chart.onclick = pick; list.onclick = pick;
chart.onkeydown = e => e.key === "Enter" && pick(e);
render();
</script>
</body>
</html>
