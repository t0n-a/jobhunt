<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Pipeline board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Hallmark · macrostructure: Bento/board (pipeline columns) · tone: brutalist · theme: Brutal
 * the status IS the layout: each job lives in its stage column; drag to move */
:root {
  --paper: oklch(96% 0.01 95); --ink: oklch(15% 0 0); --card: oklch(100% 0 0); --shadow: oklch(15% 0 0);
  --found: oklch(88% 0.02 95); --ranked: oklch(82% 0.12 230); --drafted: oklch(80% 0.13 310);
  --waiting: oklch(90% 0.18 100); --sent: oklch(80% 0.17 150); --blocked: oklch(62% 0.23 28);
  --focus: oklch(55% 0.25 265);
  --display: "Archivo Black", Impact, sans-serif; --body: "Archivo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: oklch(16% 0 0); --ink: oklch(96% 0.01 95); --card: oklch(22% 0 0); --shadow: oklch(96% 0.01 95);
  --found: oklch(40% 0.02 95); --ranked: oklch(45% 0.12 230); --drafted: oklch(45% 0.13 310);
  --waiting: oklch(70% 0.16 100); --sent: oklch(48% 0.13 150); --blocked: oklch(55% 0.2 28); --focus: oklch(80% 0.17 100);
}}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 500 15px/1.4 var(--body); }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 20px; border-bottom: 4px solid var(--ink); }
header .logo { font: 32px/1 var(--display); text-transform: uppercase; }
header nav { display: flex; flex-wrap: wrap; gap: 4px; }
header nav a { color: var(--ink); text-decoration: none; font-weight: 700; padding: 6px 10px; border: 2px solid transparent; white-space: nowrap; }
header nav a[aria-current] { border-color: var(--ink); background: var(--waiting); color: oklch(15% 0 0); }
.paste { margin-left: auto; font: 700 15px var(--body); background: var(--ink); color: var(--paper); border: 0; padding: 10px 16px; cursor: pointer; }
.paste:hover { background: var(--focus); }
.hazard { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 12px 20px; color: oklch(15% 0 0);
  background: repeating-linear-gradient(-45deg, var(--waiting) 0 18px, oklch(15% 0 0) 18px 36px); border-bottom: 4px solid var(--ink); }
.hazard > * { background: var(--waiting); padding: 4px 10px; font-weight: 700; }
.hazard strong { font: 22px var(--display); text-transform: uppercase; }
.board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); min-height: calc(100dvh - 140px); }
.col { border-right: 4px solid var(--ink); padding: 0 10px 20px; transition: background-color .15s var(--ease, ease-out); }
.col:last-child { border-right: 0; }
.col.over { background: color-mix(in oklch, var(--waiting) 30%, transparent); }
.col h2 { margin: 0 -10px 12px; padding: 10px; font: 18px/1 var(--display); text-transform: uppercase; border-bottom: 4px solid var(--ink); display: flex; justify-content: space-between; color: oklch(15% 0 0); }
.col h2 span { font-size: 28px; }
.col[data-s="found"] h2 { background: var(--found); } .col[data-s="ranked"] h2 { background: var(--ranked); }
.col[data-s="drafted"] h2 { background: var(--drafted); } .col[data-s="waiting"] h2 { background: var(--waiting); }
.col[data-s="sent"] h2 { background: var(--sent); } .col[data-s="blocked"] h2 { background: var(--blocked); color: var(--paper); }
.card { background: var(--card); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--shadow); padding: 10px; margin-bottom: 14px; cursor: grab; transition: transform .12s ease-out, box-shadow .12s ease-out; }
.card:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--shadow); }
.card.dragging { opacity: .4; }
.card .fit { font: 44px/.9 var(--display); }
.card .fit small { font: 700 11px var(--body); text-transform: uppercase; vertical-align: top; }
.card h3 { font: 700 15px/1.2 var(--body); margin: 6px 0 2px; }
.card .co { font-size: 13px; opacity: .8; }
.card .flag { margin: 8px -10px 0; padding: 6px 10px; background: var(--blocked); color: oklch(98% 0 0); font-size: 13px; font-weight: 700; }
.card .flag::before { content: "⚠ UNVERIFIED  "; }
.card button { margin-top: 10px; width: 100%; font: 700 13px var(--body); text-align: left; background: var(--ink); color: var(--paper); border: 0; padding: 8px; cursor: pointer; }
.card button:hover { background: var(--focus); }
.card button::after { content: " →"; float: right; }
@media (max-width: 1000px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } .col { border-bottom: 4px solid var(--ink); } }
@media (max-width: 560px) { .board { grid-template-columns: minmax(0, 1fr); } .col { border-right: 0; } .paste { margin-left: 0; } }
@media (prefers-reduced-motion: reduce) { .card, .col { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<header>
  <span class="logo">Jobhunt</span>
  <nav><a href="#">Home</a><a href="#">Today</a><a href="#" aria-current="page">Jobs</a><a href="#">Gaps</a><a href="#">Apps</a><a href="#">Evidence</a><a href="#">Counselor</a></nav>
  <button class="paste">+ Paste a job</button>
</header>
<div class="hazard" id="hazard"></div>
<main class="board" id="board"></main>
<script src="data.js"></script>
<script>
const ORDER = ["blocked", "waiting", "drafted", "ranked", "found", "sent"];
const LABEL = { ...STAGE_LABEL, waiting: "Your yes" };
function render() {
  const w = JOBS.filter(j => j.status === "waiting").length, b = JOBS.filter(j => j.status === "blocked").length;
  hazard.innerHTML = `<strong>${w + b} need you</strong><span>${w} waiting for your yes</span><span>${b} blocked</span>`;
  board.innerHTML = ORDER.map(s => {
    const js = JOBS.filter(j => j.status === s).sort((a, b) => b.fit - a.fit);
    return `<section class="col" data-s="${s}" aria-label="${LABEL[s]}"><h2>${LABEL[s]} <span>${js.length}</span></h2>
      ${js.map(j => `<article class="card" draggable="true" data-id="${j.id}">
        <div class="fit">${j.fit}<small> fit</small></div><h3>${j.title}</h3><div class="co">${j.company} · ${j.where}</div>
        ${j.flag ? `<div class="flag">${j.flag.text}: ${j.flag.why}</div>` : ""}
        <button>${j.next}</button></article>`).join("")}</section>`;
  }).join("");
}
board.addEventListener("dragstart", e => { e.target.classList.add("dragging"); e.dataTransfer.setData("text", e.target.dataset.id); });
board.addEventListener("dragend", e => e.target.classList?.remove("dragging"));
board.addEventListener("dragover", e => { const c = e.target.closest(".col"); if (c) { e.preventDefault(); document.querySelectorAll(".over").forEach(x => x !== c && x.classList.remove("over")); c.classList.add("over"); } });
board.addEventListener("drop", e => { const c = e.target.closest(".col"); if (!c) return; e.preventDefault();
  JOBS.find(j => j.id == e.dataTransfer.getData("text")).status = c.dataset.s; render(); });
render();
</script>
</body>
</html>
