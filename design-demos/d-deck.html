<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D · Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Hallmark · macrostructure: Single-focus deck · tone: playful · theme: Hum
 * one job at a time; ← pass, → do the next action, ↓ later */
:root {
  --paper: oklch(96% 0.025 70); --card: oklch(99.5% 0.005 70); --ink: oklch(24% 0.03 280); --ink-soft: oklch(48% 0.03 280);
  --line: oklch(88% 0.03 70); --accent: oklch(62% 0.2 15); --accent-ink: oklch(99% 0 0); --focus: oklch(55% 0.2 270);
  --found: oklch(90% 0.02 280); --ranked: oklch(88% 0.08 230); --drafted: oklch(88% 0.08 310);
  --waiting: oklch(90% 0.12 90); --sent: oklch(89% 0.1 155); --blocked: oklch(86% 0.1 25);
  --flag: oklch(55% 0.2 25); --flag-bg: oklch(94% 0.05 25);
  --font: "Bricolage Grotesque", system-ui, sans-serif; --ease-out: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: oklch(20% 0.03 280); --card: oklch(26% 0.035 280); --ink: oklch(95% 0.01 70); --ink-soft: oklch(75% 0.02 280);
  --line: oklch(34% 0.03 280); --accent: oklch(72% 0.17 15); --accent-ink: oklch(18% 0.03 280); --focus: oklch(80% 0.13 270);
  --found: oklch(36% 0.03 280); --ranked: oklch(38% 0.08 230); --drafted: oklch(38% 0.08 310);
  --waiting: oklch(42% 0.1 90); --sent: oklch(38% 0.08 155); --blocked: oklch(40% 0.11 25);
  --flag: oklch(78% 0.14 25); --flag-bg: oklch(32% 0.07 25);
}}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--font); min-height: 100dvh; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 760px; margin: 0 auto; padding: 18px 16px; }
header b { font-weight: 800; font-size: 22px; }
header nav { display: flex; gap: 2px; background: var(--card); border-radius: 99px; padding: 4px; border: 1px solid var(--line); overflow: auto; }
header nav a { color: var(--ink-soft); text-decoration: none; padding: 6px 12px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
header nav a[aria-current] { background: var(--ink); color: var(--paper); }
main { max-width: 760px; margin: 0 auto; padding: 0 16px 40px; }
.progress { display: flex; gap: 6px; margin: 4px 0 18px; }
.progress i { flex: 1; height: 6px; border-radius: 9px; background: var(--line); }
.progress i.done { background: var(--ink-soft); } .progress i.now { background: var(--accent); }
.stage { position: relative; min-height: 420px; }
.card { position: absolute; inset: 0 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 28px; padding: 26px;
  box-shadow: 0 1px 0 var(--line), 0 18px 40px -20px oklch(30% 0.05 280 / .35); transition: transform .35s var(--ease-out), opacity .35s var(--ease-out); }
.card.peek { transform: translateY(14px) scale(.96); opacity: .6; z-index: -1; }
.card.out-l { transform: translateX(-120%) rotate(-12deg); opacity: 0; }
.card.out-r { transform: translateX(120%) rotate(12deg); opacity: 0; }
.top { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
.chip { display: inline-block; padding: 5px 12px; border-radius: 99px; font-weight: 600; font-size: 14px; }
.chip.found { background: var(--found); } .chip.ranked { background: var(--ranked); } .chip.drafted { background: var(--drafted); }
.chip.waiting { background: var(--waiting); } .chip.sent { background: var(--sent); } .chip.blocked { background: var(--blocked); }
.ring { --p: 50; width: 86px; aspect-ratio: 1; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: radial-gradient(closest-side, var(--card) 76%, transparent 78%), conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); }
.ring b { font-size: 28px; font-weight: 800; line-height: 1; } .ring small { display: block; font-size: 11px; color: var(--ink-soft); text-align: center; }
h1 { font-size: clamp(28px, 6vw, 44px); line-height: 1.05; font-weight: 800; letter-spacing: -.02em; margin: 14px 0 4px; overflow-wrap: anywhere; }
.co { font-size: 19px; color: var(--ink-soft); margin: 0 0 16px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; padding: 0; list-style: none; }
.facts li { border: 1px dashed var(--line); border-radius: 12px; padding: 4px 10px; font-size: 14px; }
.why { font-size: 18px; margin: 0 0 16px; }
.flag { background: var(--flag-bg); border-radius: 16px; padding: 12px 14px; color: var(--ink); border: 2px solid var(--flag); }
.flag b { color: var(--flag); display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
.controls { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 10px; margin-top: 16px; }
.controls button { font: 600 16px var(--font); border-radius: 18px; padding: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: transform .12s var(--ease-out); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls button:hover { transform: translateY(-2px); } .controls button:active { transform: translateY(1px); }
.controls .go { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 800; }
.controls kbd { font: inherit; opacity: .6; margin-right: 6px; }
.queue { display: flex; gap: 8px; overflow-x: auto; margin-top: 18px; padding: 3px 3px 6px; }
.queue button { flex: none; width: 150px; text-align: left; font: 400 13px/1.3 var(--font); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 10px; cursor: pointer; }
.queue button[aria-current] { outline: 2px solid var(--accent); }
.queue button b { display: block; font-size: 20px; }
.done-msg { text-align: center; padding: 120px 0; font-size: 22px; font-weight: 600; }
@media (max-width: 560px) { .controls { grid-template-columns: 1fr 1fr; } .controls .go { grid-column: 1 / -1; } header nav a:not([aria-current]) { display: none; } }
@media (prefers-reduced-motion: reduce) { .card, .controls button { transition: opacity .15s; } .card.out-l, .card.out-r { transform: none; } }
</style>
</head>
<body>
<header><b>jobhunt</b><nav><a href="#">Home</a><a href="#">Today</a><a href="#" aria-current="page">Jobs</a><a href="#">Gaps</a><a href="#">Apps</a><a href="#">Evidence</a></nav></header>
<main>
  <div class="progress" id="progress"></div>
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="controls">
    <button id="pass"><kbd>←</kbd>Pass</button>
    <button id="later"><kbd>↓</kbd>Later</button>
    <button id="go" class="go"></button>
  </div>
  <div class="queue" id="queue" aria-label="Up next"></div>
</main>
<script src="data.js"></script>
<script>
let i = 0;
const card = (j, cls = "") => `<article class="card ${cls}">
  <div class="top"><div><span class="chip ${j.status}">${STAGE_LABEL[j.status]}</span><h1>${j.title}</h1><p class="co">${j.company}</p></div>
  <div class="ring" style="--p:${j.fit}"><div><b>${j.fit}</b><small>fit</small></div></div></div>
  <ul class="facts"><li>${j.where}</li><li>${j.track}</li><li>seniority: ${j.seniority}</li><li>found ${j.age} ago</li></ul>
  <p class="why">${j.rationale || "Not scored yet. Score it to see why it might fit."}</p>
  ${j.flag ? `<div class="flag"><b>Check this before it goes out</b>${j.flag.text}: ${j.flag.why}</div>` : ""}</article>`;
function render() {
  progress.innerHTML = JOBS.map((_, k) => `<i class="${k < i ? "done" : k === i ? "now" : ""}"></i>`).join("");
  const j = JOBS[i];
  if (!j) { stage.innerHTML = `<p class="done-msg">Inbox zero. Go outside.</p>`; go.textContent = "Start over"; queue.innerHTML = ""; return; }
  stage.innerHTML = (JOBS[i + 1] ? card(JOBS[i + 1], "peek") : "") + card(j);
  go.innerHTML = `<kbd>→</kbd>${j.next}`;
  queue.innerHTML = JOBS.slice(i).map((q, k) => `<button ${k === 0 ? 'aria-current="true"' : ""} data-k="${i + k}"><b>${q.fit}</b>${q.title}<br>${q.company}</button>`).join("");
}
function fling(dir) {
  if (!JOBS[i]) { i = 0; return render(); }
  const c = stage.querySelector(".card:not(.peek)");
  c.classList.add(dir); setTimeout(() => { i++; render(); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 300);
}
pass.onclick = () => fling("out-l"); go.onclick = () => fling("out-r");
later.onclick = () => { JOBS.push(JOBS.splice(i, 1)[0]); render(); };
queue.onclick = e => { const b = e.target.closest("button"); if (b) { i = +b.dataset.k; render(); } };
addEventListener("keydown", e => ({ ArrowLeft: pass, ArrowRight: go, ArrowDown: later })[e.key]?.click());
render();
</script>
</body>
</html>
