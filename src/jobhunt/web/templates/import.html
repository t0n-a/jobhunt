{% extends "base.html" %}
{% block title %}Import — jobhunt{% endblock %}
{% block content %}
<div class="callout">
  <strong>Everything imported arrives unconfirmed.</strong>
  <p>Review it on the Evidence page before it reaches a resume.</p>
</div>

<section class="card">
  <h3>CV</h3>
  <form method="post" action="/import/cv" enctype="multipart/form-data">
    <input type="file" name="file" accept=".pdf,.docx,.txt" required>
    <button type="submit" class="primary" data-busy="Importing…">Import CV</button>
  </form>
</section>

<section class="card">
  <h3>Certificate</h3>
  <form method="post" action="/import/certificate" enctype="multipart/form-data">
    <input type="text" name="name" placeholder="Certificate name" required>
    <input type="text" name="issuer" placeholder="Issuer">
    <input type="date" name="issued_on" aria-label="Issued on">
    <input type="file" name="file" accept=".pdf,.png,.jpg,.jpeg" required>
    <button type="submit" data-busy="Adding…">Add certificate</button>
  </form>
</section>

<section class="card">
  <h3>GitHub</h3>
  <form method="post" action="/import/github">
    <input type="text" name="username" placeholder="github-handle" required>
    <button type="submit" data-busy="Importing…">Import repositories</button>
  </form>
</section>

<section class="card">
  <h3>Coursework</h3>
  <form method="post" action="/import/coursework">
    <input type="text" name="institution" value="ISEP" required>
    <textarea name="text" rows="8" placeholder="Paste your course list or transcript" required></textarea>
    <button type="submit" data-busy="Importing…">Import coursework</button>
  </form>
</section>
{% endblock %}
