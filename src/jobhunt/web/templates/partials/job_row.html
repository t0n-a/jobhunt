{% set score = scores.get(job.id) %}{% set st = states[job.id] %}
<tr class="{{ st.key }}{% if st.key in ('blocked', 'waiting') %} hot{% endif %}"{% if selected and selected.id == job.id %} aria-selected="true"{% endif %}>
  <td class="role">
    <a class="t" href="/jobs?sel={{ job.id }}">{% if st.unverified %}<span class="flagmark" title="Has lines not backed by evidence">!</span>{% endif %}{{ job.title }}</a>
    <div class="c">{{ job.company }}{% if job.remote %} · remote{% elif job.location %} · {{ job.location }}{% endif %}</div>
  </td>
  <td class="fitcell">{% if score %}<div class="fitbar"><span><i style="--p: {{ score.fit_score }}"></i></span><b>{{ score.fit_score }}</b></div>{% else %}<span class="meta">—</span>{% endif %}</td>
  <td class="col-st"><span class="st{% if st.key in ('blocked', 'waiting') %} hot{% endif %} {{ st.key }}">{{ st.label }}</span></td>
</tr>
