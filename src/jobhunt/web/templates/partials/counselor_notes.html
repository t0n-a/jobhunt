{% if not notes %}
  <p class="empty">Nothing noted yet.</p>
{% else %}
  <ul class="cards">
    {% for note in notes %}
      <li class="card note" id="note-{{ note.id }}">
        <div class="head"><span class="pill">{{ note.kind }}</span><p>{{ note.text }}</p></div>
        <button type="button" class="danger" hx-post="/counselor/notes/{{ note.id }}/close"
                hx-target="#notes" hx-swap="innerHTML">Forget this</button>
      </li>
    {% endfor %}
  </ul>
{% endif %}
