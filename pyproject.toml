[project]
name = "jobhunt"
version = "0.1.0"
description = "Local-first job-search assistant: finds and ranks jobs, tailors applications from verified evidence, pre-fills forms, drafts outreach"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "t0na" }]
keywords = ["job-search", "resume", "ats", "telegram-bot", "llm", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Web Environment",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "python-jobspy==1.3.0",
    "playwright==1.63.0",
]

[project.urls]
Homepage = "https://github.com/t0n-a/jobhunt"
Issues = "https://github.com/t0n-a/jobhunt/issues"

[project.scripts]
jobhunt = "jobhunt.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.7", "jsonschema>=4.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits the real agy CLI; requires auth and network",
    "latex: shells out to latexmk and pdftotext; skipped when they are absent",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
# The formatter reformats Python code blocks inside Markdown, which would rewrite
# every phase plan under docs/ — historical records of how each phase was built,
# and the source the SDD task briefs are extracted from. The formatter's job here
# is the code, not the prose.
extend-exclude = ["*.md"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]
