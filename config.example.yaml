# Copy to config.yaml and edit. config.yaml is gitignored.
profile:
  name: Your Name
  email: you@example.com
  location: Porto, Portugal
  github_username: your-github-handle
  # Optional. Each appears on the resume header only when set.
  # phone: "+351 000 000 000"
  # linkedin: linkedin.com/in/your-handle
  # website: your-site.example

llm:
  provider: agy            # "agy" (Antigravity CLI) or "openai_compat"
  model: gemini-3.8-flash-medium
  binary: agy.exe          # resolved on PATH; agy.exe works from inside WSL
  timeout_seconds: 300
  cache_dir: ./data/llm_cache
  # Free Google AI Studio variant (keys in .env; see README "LLM Provider"):
  # provider: openai_compat
  # model: gemini-flash-latest
  # min_interval_seconds: 6  # free tier allows about 10 requests a minute

data_dir: ./data

# Ranking. Defaults shown; uncomment to change.
# ranking:
#   languages: [english, portuguese]   # postings requiring any other language are dropped
#   shortlist_fit: 40                  # fit scores below this are not shortlisted
#   strong_fit: 80                     # fit scores from this up are strong matches
#   min_pay_outside_eu: 60000          # yearly EUR a non-EU job must pay to stay in the running
#   liveness_check_limit: 50           # postings checked for closed listings per run

# Job sources. Company boards are where most real postings originate — the large
# aggregators mostly re-host them — so filling in the three ATS lists below
# matters more than anything else here. A company's board slug is usually the
# last path segment of its careers URL.
# autopilot:
#   tailor_per_run: 5       # shortlist jobs tailored per daily run
#   max_waiting: 10         # never more than this many applications waiting on you
#   trust_target: 10        # clean approvals before autopilot can be switched on
#   heavy_edit_limit: 2     # more edited/deleted bullets than this earns no trust
#   web_url: http://127.0.0.1:8000   # where Telegram review links point
#   autopilot_fit: 85       # only fit this high or more may go out unseen
#   daily_cap: 10           # most applications autopilot submits per day
#   ats_allowlist: [greenhouse, lever, ashby]   # ATS types that may auto-submit

sources:
  enabled:
    # LinkedIn is scraped logged-out and is best-effort; it may be blocked on any run.
    - linkedin
    - indeed
    - greenhouse
    - lever
    - ashby
    - remotive
    - landingjobs
    - hackernews
    # - remoteok
    # - weworkremotely
    # - itjobs        # needs ITJOBS_API_KEY in .env

  # e.g. boards-api.greenhouse.io/v1/boards/<slug>/jobs
  greenhouse: []
  # e.g. api.lever.co/v0/postings/<slug>
  lever: []
  # e.g. api.ashbyhq.com/posting-api/job-board/<slug>
  ashby: []

  # Hacker News "Who is hiring?" comments must match a location keyword AND a
  # role keyword. Location alone matches every remote listing of any discipline.
  location_keywords: [porto, portugal, remote]
